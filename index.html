
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#24113f">
<title>EduPuntos</title>
<style>
:root {
  --fondo:#170b29;
  --panel:#24113f;
  --panel2:#321b50;
  --morado:#8b5cf6;
  --claro:#c4b5fd;
  --texto:#faf7ff;
  --suave:#c7b8dd;
  --borde:#4b3268;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:var(--fondo);
  color:var(--texto);
  font-family:Arial, sans-serif;
}
button,input,select {font:inherit}
button {
  border:0;
  border-radius:12px;
  padding:13px;
  background:var(--morado);
  color:white;
  font-weight:bold;
  cursor:pointer;
}
input,select {
  width:100%;
  padding:12px;
  background:#180d29;
  border:1px solid var(--borde);
  color:white;
  border-radius:10px;
}
header {
  position:sticky;
  top:0;
  z-index:5;
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  background:var(--panel);
  border-bottom:1px solid var(--borde);
}
header .inicio,header .menu {
  background:var(--panel2);
  border:1px solid var(--borde);
}
header .marca {font-size:18px;font-weight:bold}
header .espacio {flex:1}
main {max-width:700px;margin:auto;padding:16px 13px 40px}
h1 {font-size:27px;margin:0 0 8px}
h2 {font-size:21px;margin:20px 0 12px}
h3 {margin:0 0 12px}
p {line-height:1.5}
.suave {color:var(--suave)}
.tarjeta {
  background:var(--panel);
  border:1px solid var(--borde);
  border-radius:17px;
  padding:16px;
  margin-bottom:12px;
}
.bienvenida {
  padding:22px;
  border-radius:20px;
  background:linear-gradient(135deg,#492778,#24113f);
  margin-bottom:16px;
}
.grid {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.acceso {
  min-height:110px;
  text-align:left;
  background:var(--panel);
  border:1px solid var(--borde);
  display:flex;
  flex-direction:column;
  gap:9px;
}
.acceso span {font-size:23px}
.acceso small {color:var(--suave);font-weight:normal}
.campo {margin:12px 0}
.campo label {
  display:block;
  margin-bottom:7px;
  color:var(--suave);
}
.fila {
  display:flex;
  align-items:center;
  gap:10px;
}
.fila .crece {flex:1;min-width:0}
.estudiante {
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px;
  background:var(--panel);
  border:1px solid var(--borde);
  border-radius:14px;
  margin-bottom:9px;
}
.estudiante .datos {flex:1;min-width:0;overflow-wrap:anywhere}
.estudiante small {display:block;color:var(--suave);margin-top:5px}
.estudiante button {padding:10px}
.avatar {
  background:#4c2d70;
  border-radius:14px;
  padding:13px;
  font-size:22px;
}
.categorias {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}
.categoria {
  background:var(--panel2);
  border:1px solid var(--borde);
  min-height:65px;
}
.categoria.activa,.punto.activo {
  background:#6d28d9;
  border:2px solid var(--claro);
}
.puntos {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px;
}
.punto {background:var(--panel2);border:1px solid var(--borde)}
.punto strong {display:block;font-size:25px;margin-bottom:4px}
.confirmar {width:100%;margin-top:14px;padding:16px}
.estadisticas {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.estadistica {
  padding:14px;
  border-radius:14px;
  background:var(--panel2);
  border:1px solid var(--borde);
}
.estadistica strong {display:block;font-size:25px}
.estadistica small {color:var(--suave)}
.historial {
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:12px 0;
  border-bottom:1px solid var(--borde);
}
.positivo {color:#86efac;font-weight:bold}
.secundario {background:var(--panel2);border:1px solid var(--borde)}
.ancho {width:100%}
.enlace {
  overflow-wrap:anywhere;
  background:#180d29;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--borde);
  margin:10px 0;
}
.aviso {
  background:var(--panel2);
  padding:13px;
  border-radius:12px;
  color:var(--suave);
  font-size:14px;
}
.vacio {text-align:center;color:var(--suave);padding:20px}
.oculto {display:none!important}
#menuLateral {
  position:fixed;
  z-index:10;
  inset:0;
  background:#0009;
}
#menuContenido {
  background:var(--panel);
  width:min(310px,85%);
  height:100%;
  padding:18px;
  overflow:auto;
}
#menuContenido button {
  display:block;
  width:100%;
  text-align:left;
  margin:8px 0;
  background:var(--panel2);
}
#menuContenido .cerrar {text-align:center}
.pie {text-align:center;color:var(--suave);font-size:12px;margin-top:24px}
@media(max-width:360px) {
  header {gap:6px;padding:9px}
  header .marca {font-size:15px}
  header button {padding:10px 8px}
  main {padding:12px 9px}
}
</style>
</head>
<body>

<header>
  <button class="inicio" onclick="inicio()">⌂ Inicio</button>
  <div class="marca">💜 EduPuntos</div>
  <div class="espacio"></div>
  <button class="menu" onclick="menu(true)">☰</button>
</header>

<div id="menuLateral" class="oculto" onclick="if(event.target===this)menu(false)">
  <nav id="menuContenido">
    <button class="cerrar" onclick="menu(false)">✕ Cerrar menú</button>
    <h2>💜 EduPuntos</h2>
    <button onclick="inicio()">⌂ Inicio</button>
    <button onclick="pagina('estudiantes')">👥 Estudiantes</button>
    <button onclick="pagina('nuevo')">＋ Ingresar estudiante</button>
    <button onclick="pagina('nfc')">📳 Generador de enlaces NFC</button>
    <button onclick="pagina('informes')">📊 Porcentaje de logro</button>
    <button onclick="pagina('herramientas')">⚙️ Herramientas y respaldo</button>
  </nav>
</div>

<main id="app"></main>

<script>
const URL_BASE = location.origin + location.pathname;
const CLAVE = "edupuntos_datos_v1";

let datos = {estudiantes:[], historial:[]};
let estudianteActual = null;
let categoriaActual = "";
let puntosActuales = 1;
let paginaActual = "inicio";

try {
  const guardado = JSON.parse(localStorage.getItem(CLAVE));
  if (guardado &&
      Array.isArray(guardado.estudiantes) &&
      Array.isArray(guardado.historial)) {
    datos = guardado;
  }
} catch(e) {}

function guardar() {
  localStorage.setItem(CLAVE, JSON.stringify(datos));
}

function seguro(texto) {
  return String(texto ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  })[c]);
}

function menu(abrir) {
  document.getElementById("menuLateral")
    .classList.toggle("oculto", !abrir);
}

function inicio() {
  menu(false);
  pagina("inicio");
}

function pagina(nombre) {
  menu(false);
  paginaActual = nombre;
  const app = document.getElementById("app");

  if (nombre === "inicio") {
    const id = new URLSearchParams(location.search).get("student");
    const encontrado = datos.estudiantes.find(e => e.id === id);
    if (encontrado) {
      abrirPerfil(encontrado.id);
      return;
    }
    app.innerHTML = `
      <section class="bienvenida">
        <h1>EduPuntos 💜</h1>
        <p class="suave">Reconocer el esfuerzo, celebrar los avances y aprender jugando.</p>
      </section>
      <div class="estadisticas">
        <div class="estadistica"><strong>${datos.estudiantes.length}</strong><small>Estudiantes</small></div>
        <div class="estadistica"><strong>${totalGeneral()}</strong><small>Puntos entregados</small></div>
      </div>
      <h2>Accesos rápidos</h2>
      <div class="grid">
        <button class="acceso" onclick="pagina('estudiantes')"><span>👥</span>Estudiantes<small>Ver perfiles y puntos</small></button>
        <button class="acceso" onclick="pagina('nuevo')"><span>➕</span>Ingresar estudiante<small>Registrar un alumno</small></button>
        <button class="acceso" onclick="pagina('nfc')"><span>📳</span>Enlaces NFC<small>Generar enlaces personales</small></button>
        <button class="acceso" onclick="pagina('informes')"><span>📊</span>Porcentaje de logro<small>Resumen de puntos</small></button>
        <button class="acceso" onclick="pagina('herramientas')"><span>⚙️</span>Herramientas<small>Respaldo de datos</small></button>
      </div>
      <div class="pie">EduPuntos · Aplicación educativa móvil</div>`;
  }

  if (nombre === "estudiantes") {
    app.innerHTML = `
      <h1>Estudiantes</h1>
      <button class="ancho" onclick="pagina('nuevo')">＋ Ingresar estudiante</button>
      <div class="campo"><label>Buscar por nombre o curso</label>
      <input id="buscar" placeholder="Escribe para buscar..." oninput="filtrar()"></div>
      <div id="lista">${listaEstudiantes(datos.estudiantes)}</div>`;
  }

  if (nombre === "nuevo") {
    app.innerHTML = `
      <h1>Ingresar estudiante</h1>
      <div class="tarjeta">
        <div class="campo"><label>Nombre y apellido</label>
          <input id="nombre" placeholder="Nombre del estudiante"></div>
        <div class="campo"><label>Curso</label>
          <input id="curso" placeholder="Ej. 6° Básico"></div>
        <div class="campo"><label>Código NFC (opcional)</label>
          <input id="codigo" placeholder="Se genera automáticamente"></div>
        <button class="ancho" onclick="agregarEstudiante()">Guardar estudiante</button>
      </div>`;
  }

  if (nombre === "nfc") {
    app.innerHTML = `
      <h1>Generador de enlaces NFC</h1>
      <div class="aviso">Selecciona un estudiante y genera su enlace personal. Después copia el enlace y escríbelo en la tarjeta con NFC Tools: Escribir → URL/URI.</div>
      <div class="campo"><label>Seleccionar estudiante</label>
        <select id="seleccionNFC" onchange="generarEnlace()">
          <option value="">Selecciona un estudiante</option>
          ${datos.estudiantes.map(e=>`<option value="${seguro(e.id)}">${seguro(e.nombre)} · ${seguro(e.curso)}</option>`).join("")}
        </select>
      </div>
      <div id="resultadoNFC" class="tarjeta oculto">
        <h3>Enlace individual</h3>
        <div id="enlaceNFC" class="enlace"></div>
        <button class="ancho" onclick="copiarEnlace()">📋 Copiar enlace NFC</button>
        <button class="ancho secundario" style="margin-top:8px" onclick="abrirEnlace()">Abrir perfil</button>
        <p class="suave">Código: <span id="codigoNFC"></span></p>
      </div>
      <h2>Estudiantes registrados</h2>
      ${datos.estudiantes.length ? datos.estudiantes.map(e=>`
        <div class="estudiante">
          <div class="avatar">📳</div>
          <div class="datos"><strong>${seguro(e.nombre)}</strong><small>${seguro(e.curso)}</small></div>
          <button onclick="elegirNFC('${e.id}')">Generar</button>
        </div>`).join("") : '<div class="vacio">Primero registra estudiantes.</div>'}`;
  }

  if (nombre === "informes") {
    app.innerHTML = `
      <h1>Porcentaje de logro</h1>
      <div class="estadisticas">
        <div class="estadistica"><strong>${datos.estudiantes.length}</strong><small>Estudiantes</small></div>
        <div class="estadistica"><strong>${totalGeneral()}</strong><small>Puntos asignados</small></div>
      </div>
      <p class="aviso">El porcentaje real requiere definir una meta de puntos. Este resumen muestra los puntos acumulados por estudiante.</p>
      <h2>Resumen por estudiante</h2>
      ${datos.estudiantes.length ? [...datos.estudiantes].sort((a,b)=>total(b.id)-total(a.id)).map(e=>`
        <div class="estudiante"><div class="datos"><strong>${seguro(e.nombre)}</strong><small>${seguro(e.curso)}</small></div><span>${total(e.id)} pts</span></div>`).join("") : '<div class="vacio">No hay estudiantes registrados.</div>'}`;
  }

  if (nombre === "herramientas") {
    app.innerHTML = `
      <h1>Herramientas</h1>
      <div class="tarjeta"><h3>Respaldo JSON</h3><p class="suave">Descarga una copia de los estudiantes y su historial.</p><button class="ancho" onclick="respaldo()">Descargar respaldo JSON</button></div>
      <div class="tarjeta"><h3>Restaurar respaldo</h3><p class="suave">Importar un archivo JSON guardado anteriormente.</p><input type="file" id="archivoJSON" accept=".json,application/json" onchange="restaurar(event)"></div>
      <div class="tarjeta"><h3>Exportar estudiantes</h3><button class="ancho secundario" onclick="exportarCSV()">Exportar CSV</button></div>
      <div class="aviso">Los datos se guardan en el navegador de este dispositivo. Descarga respaldos periódicos. Esta versión no sincroniza automáticamente entre celulares.</div>`;
  }
}

function total(id) {
  return datos.historial.filter(h=>h.estudianteId===id)
    .reduce((s,h)=>s+h.puntos,0);
}
function totalGeneral() {
  return datos.historial.reduce((s,h)=>s+h.puntos,0);
}
function listaEstudiantes(lista) {
  if (!lista.length) return '<div class="vacio">No hay estudiantes registrados.</div>';
  return lista.map(e=>`
    <div class="estudiante">
      <div class="avatar">👤</div>
      <div class="datos"><strong>${seguro(e.nombre)}</strong><small>${seguro(e.curso||"Sin curso")} · ${total(e.id)} puntos</small></div>
      <button onclick="abrirPerfil('${e.id}')">Ver</button>
    </div>`).join("");
}
function filtrar() {
  const q=document.getElementById("buscar").value.toLowerCase();
  document.getElementById("lista").innerHTML=listaEstudiantes(
    datos.estudiantes.filter(e=>(e.nombre+" "+e.curso).toLowerCase().includes(q))
  );
}
function agregarEstudiante() {
  const nombre=document.getElementById("nombre").value.trim();
  const curso=document.getElementById("curso").value.trim();
  const codigo=document.getElementById("codigo").value.trim();
  if(!nombre) return alert("Escribe el nombre del estudiante.");
  const id=codigo || ("ep-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7));
  if(datos.estudiantes.some(e=>e.id===id)) return alert("Ese código ya existe.");
  datos.estudiantes.push({id,nombre,curso});
  guardar();
  pagina("estudiantes");
}
const categorias=[
  ["📚","Trabajo en clases"],
  ["✅","Responsabilidad"],
  ["🤝","Convivencia"],
  ["🙋","Participación"],
  ["💪","Esfuerzo"],
  ["💜","Ayuda a otros"],
  ["🎯","Actividad completada"],
  ["⭐","Otra categoría"]
];
function abrirPerfil(id) {
  const e=datos.estudiantes.find(x=>x.id===id);
  if(!e) return pagina("estudiantes");
  estudianteActual=id;
  categoriaActual="";
  puntosActuales=1;
  dibujarPerfil();
}
function dibujarPerfil() {
  const e=datos.estudiantes.find(x=>x.id===estudianteActual);
  if(!e) return pagina("estudiantes");
  paginaActual="perfil";
  const historial=datos.historial.filter(h=>h.estudianteId===e.id);
  document.getElementById("app").innerHTML=`
    <div class="tarjeta">
      <div class="perfil" style="text-align:center;padding:8px 0 18px">
        <div class="avatar" style="display:inline-block;font-size:30px">👤</div>
        <h1 style="font-size:24px;margin-top:10px">${seguro(e.nombre)}</h1>
        <p class="suave">${seguro(e.curso||"Sin curso")} · ${total(e.id)} puntos acumulados</p>
      </div>
      <div class="estadisticas">
        <div class="estadistica"><strong>${total(e.id)}</strong><small>Puntos acumulados</small></div>
        <div class="estadistica"><strong>${historial.length}</strong><small>Asignaciones</small></div>
      </div>
      <h2>1. Categorías de asignación</h2>
      <div class="categorias">
        ${categorias.map(([icono,nombre])=>`
          <button class="categoria ${categoriaActual===nombre?'activa':''}" onclick="seleccionarCategoria('${nombre}')">${icono}<br>${nombre}</button>
        `).join("")}
      </div>
      <h2>2. Puntos a entregar</h2>
      <div class="puntos">
        ${[1,2,3].map(n=>`
          <button class="punto ${puntosActuales===n?'activo':''}" onclick="seleccionarPuntos(${n})">
            <strong>+${n}</strong>${n===1?'punto':'puntos'}
          </button>`).join("")}
      </div>
      <button class="confirmar" onclick="confirmarAsignacion()">✓ Confirmar asignación</button>
      <button class="ancho secundario" style="margin-top:9px" onclick="pagina('nfc')">📳 Generar enlace NFC</button>
    </div>
    <h2>Historial de asignaciones</h2>
    <div class="tarjeta">
      ${historial.length ? historial.slice().reverse().map(h=>`
        <div class="historial">
          <div><strong>${seguro(h.categoria)}</strong><br><small class="suave">${new Date(h.fecha).toLocaleString("es-CL")}</small></div>
          <span class="positivo">+${h.puntos}</span>
        </div>`).join("") : '<div class="vacio">Todavía no hay asignaciones.</div>'}
    </div>`;
}
function seleccionarCategoria(nombre) {
  categoriaActual=nombre;
  dibujarPerfil();
}
function seleccionarPuntos(n) {
  puntosActuales=n;
  dibujarPerfil();
}
function confirmarAsignacion() {
  if(!categoriaActual) return alert("Selecciona una categoría antes de confirmar.");
  datos.historial.push({
    id:"h-"+Date.now(),
    estudianteId:estudianteActual,
    categoria:categoriaActual,
    puntos:puntosActuales,
    fecha:new Date().toISOString()
  });
  guardar();
  const entregados=puntosActuales;
  categoriaActual="";
  puntosActuales=1;
  dibujarPerfil();
  alert("Asignación confirmada: +"+entregados+" puntos.");
}
function enlaceEstudiante(e) {
  return URL_BASE+"?student="+encodeURIComponent(e.id);
}
function generarEnlace() {
  const id=document.getElementById("seleccionNFC").value;
  const e=datos.estudiantes.find(x=>x.id===id);
  const box=document.getElementById("resultadoNFC");
  if(!e) {box.classList.add("oculto");return}
  document.getElementById("enlaceNFC").textContent=enlaceEstudiante(e);
  document.getElementById("codigoNFC").textContent=e.id;
  box.classList.remove("oculto");
}
function elegirNFC(id) {
  document.getElementById("seleccionNFC").value=id;
  generarEnlace();
  document.getElementById("resultadoNFC").scrollIntoView({behavior:"smooth"});
}
async function copiarEnlace() {
  const texto=document.getElementById("enlaceNFC").textContent;
  try {
    await navigator.clipboard.writeText(texto);
    alert("Enlace copiado. Ya puedes pegarlo en NFC Tools.");
  } catch(e) {
    prompt("Copia este enlace:",texto);
  }
}
function abrirEnlace() {
  location.href=document.getElementById("enlaceNFC").textContent;
}
function descargar(contenido,nombre,tipo) {
  const blob=new Blob([contenido],{type:tipo});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;a.download=nombre;a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function respaldo() {
  descargar(JSON.stringify(datos,null,2),
    "edupuntos-respaldo.json","application/json");
}
function restaurar(evento) {
  const archivo=evento.target.files[0];
  if(!archivo) return;
  const lector=new FileReader();
  lector.onload=()=>{
    try {
      const x=JSON.parse(lector.result);
      if(!Array.isArray(x.estudiantes)||!Array.isArray(x.historial))
        throw new Error();
      if(!confirm("El respaldo reemplazará los datos actuales de este navegador. ¿Continuar?")) return;
      datos=x;
      guardar();
      alert("Respaldo restaurado.");
      pagina("inicio");
    } catch(e) { alert("El archivo no es un respaldo válido de EduPuntos."); }
  };
  lector.readAsText(archivo);
}
function exportarCSV() {
  const filas=[["Nombre","Curso","Código","Puntos"]];
  datos.estudiantes.forEach(e=>filas.push([e.nombre,e.curso,e.id,total(e.id)]));
  const csv=filas.map(f=>f.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(";")).join("\r\n");
  descargar("\ufeff"+csv,"edupuntos-estudiantes.csv","text/csv;charset=utf-8");
}

const idInicial=new URLSearchParams(location.search).get("student");
if(idInicial && datos.estudiantes.some(e=>e.id===idInicial)) {
  abrirPerfil(idInicial);
} else {
  pagina("inicio");
}
</script>
</body>
</html>
